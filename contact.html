<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact - Clément Harinquet</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <div class="contact-page">

    <nav class="back-nav">
      <a href="index.html"><i class="fas fa-arrow-left"></i> Retour à l'accueil</a>
    </nav>

    <div class="contact-hero">
      <h1>Me Contacter</h1>
      <p>N'hésitez pas à me contacter pour toute question ou opportunité.</p>
    </div>

    <form class="contact-form">
      <input type="text" name="name" placeholder="Votre nom" required />
      <input type="email" name="email" placeholder="Votre e-mail" required />
      <textarea name="message" placeholder="Votre message" rows="6" required></textarea>
      <button type="submit"><i class="fas fa-paper-plane"></i> Envoyer</button>
    </form>

    <div class="contact-links">
      <a class="contact-link-card" href="mailto:clement@example.com">
        <i class="fas fa-envelope"></i>
        <span>Email direct</span>
      </a>
      <a class="contact-link-card" href="https://www.linkedin.com/in/cl%C3%A9ment-harinquet-54143a195/" target="_blank">
        <i class="fab fa-linkedin"></i>
        <span>LinkedIn</span>
      </a>
    </div>

  </div>

</body>
</html>
